# Build: Next.js 16 needs Node.js 20.9 or newer (Netlify's default image used 18). The site is a
# static export, so the files in out/ are published.
[build]
  command = "bun run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Security headers for the static site.
#
# Content-Security-Policy notes:
# - 'unsafe-eval' is needed by the Code node and conditions, which run user JavaScript inside a
#   sandboxed Web Worker (created from a blob: URL, hence worker-src blob:).
# - cdn.jsdelivr.net serves the Monaco editor. The Poppins font is served with the app (next/font).
# - connect-src allows any https URL because HTTP Request nodes and AI providers are called from
#   the browser; plain http is allowed only for local development servers.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"

# The social preview image is generated at build time without a file extension.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
